data_dir: data
contact: "replace-with-operator-contact@example.invalid"
concurrent_requests: 16
concurrent_per_host: 1
throttle_start_seconds: 1
throttle_max_seconds: 60
retry_times: 3
retry_statuses: [408, 425, 429, 500, 502, 503, 504]
retry_backoff_base_seconds: 2
retry_max_delay_seconds: 3600
retry_jitter: 0.2
download_timeout_seconds: 60
playwright_auto_fallback: true
playwright_abort_resource_types: [image, media]
sitemap_max_depth: 5
trap_query_keys: [sessionid, jsessionid, phpsessid]
trap_exceptions: {}
accepted_mime_types:
  - text/html
  - application/xhtml+xml
  - application/xml
  - application/pdf
  - application/msword
  - application/vnd.ms-excel
  - application/vnd.ms-powerpoint
  - application/rtf
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - application/vnd.openxmlformats-officedocument.presentationml.presentation
  - application/vnd.oasis.opendocument.text
  - application/vnd.oasis.opendocument.spreadsheet
  - application/vnd.oasis.opendocument.presentation
accepted_mime_prefixes: [text/, image/, video/]
media_extensions: [.jpg, .jpeg, .png, .gif, .webp, .svg, .mp4, .webm, .mov]
max_response_bytes: 104857600
warc_rotate_bytes: 1073741824
min_free_bytes: 53687091200
min_free_percent: 10
playwright_hosts: []
